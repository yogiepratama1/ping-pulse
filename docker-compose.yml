services:
  db:
    container_name: ping-pulse-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pingpulse
      POSTGRES_PASSWORD: pingpulse
      POSTGRES_DB: pingpulse
    ports:
      - "5444:5432"
    volumes:
      - ping-pulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pingpulse" ]
      interval: 5s
      timeout: 3s
      retries: 5

  ping-pulse:
    container_name: ping-pulse-app
    build: .
    ports:
      - "4321:4321"
    environment:
      DATABASE_URL: postgresql://pingpulse:pingpulse@db:5432/pingpulse
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ping-pulse-pgdata:
